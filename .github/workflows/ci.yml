name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Package tests
        run: bun run test:packages

      - name: Install browser for compiled localisation consumer tests
        run: bunx playwright install --with-deps chromium

      - name: Compiled localisation and render helper browser tests
        run: bunx vitest run --config vitest.browser.config.ts packages/i18n/tests/context.svelte.test.ts __browser_tests__/render-helper.svelte.test.ts
